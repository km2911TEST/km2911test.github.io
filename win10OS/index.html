<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrisOS V1</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            padding: 40px 20px;
            background: linear-gradient(180deg, #1e1e1e 0%, #121212 100%);
        }

        /* ярко-красной V1 */
        .title {
            font-size: 3rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }

        .version {
            color: #ff0000; /* Ярко-красный */
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        /* Ротатор цитат */
        .quote-container {
            min-height: 40px;
            font-style: italic;
            color: #a0a0a0;
            font-size: 1.2rem;
            transition: opacity 0.5s ease-in-out;
            padding: 0 20px;
        }

        /* Основной контент */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            color: #fff;
            margin-top: 40px;
        }

        /* картинокb обзора1 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .gallery-item {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.3s ease;
            cursor: pointer; /* Делаем курсор рукой при наведении */
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
        }

        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #2a2a2a; /* Заглушка, пока нет фото */
            display: block;
        }

        .gallery-item p {
            padding: 10px;
            margin: 0;
            font-weight: 600;
            font-size: 1.1rem;
            color: #e0e0e0;
        }

        /* Вложенная сетка для дополнительных картинок внутри блока Прочее */
        .sub-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 15px;
            background: #161616;
            border-top: 1px solid #333;
        }

        .sub-item {
            background-color: #222;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .sub-item:hover {
            border-color: #ff0000;
            transform: scale(1.02);
        }

        .sub-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            background-color: #2a2a2a;
            display: block;
        }

        .sub-item p {
            padding: 8px;
            margin: 0;
            font-size: 0.95rem;
            color: #ccc;
        }

        /* Кнопка скачивания */
        .download-btn {
            display: inline-block;
            background-color: #ff0000;
            color: #fff;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            margin: 40px 0;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background-color: #cc0000;
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 60px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9); 
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 85%;
            max-height: 75vh;
            border: 2px solid #333;
            border-radius: 4px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.3);
            animation: zoomIn 0.3s ease;
        }

        #modal-caption {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            text-align: center;
            color: #fff;
            padding: 15px 0;
            font-size: 1.3rem;
            font-weight: 600;
        }

        /* Кнопка закрытия (крестик) */
        .close-modal {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .close-modal:hover {
            color: #ff0000;
        }

        /* Анимация увеличения */
        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        footer {
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title">KrisOS <span class="version">V1</span></h1>
        <div class="quote-container" id="quote-box">Загрузка цитаты...</div>
    </header>

    <div class="container">
        <h2>Обзор OS</h2>
        
        <div class="gallery">
            <div class="gallery-item" onclick="openModal(this)">
                <img src="desktop.jpg" alt="Рабочий стол">
                <p>1. Рабочий стол</p>
            </div>
            
            <div class="gallery-item" onclick="openModal(this)">
                <img src="settings.jpg" alt="Настройки">
                <p>2. Настройки</p>
            </div>
            
            <div class="gallery-item" onclick="openModal(this)">
                <img src="menu.jpg" alt="Меню">
                <p>3. Меню</p>
            </div>
            
            <div class="gallery-item" style="grid-column: 1 / -1; cursor: default;">
                <p style="border-bottom: 1px solid #333; padding-bottom: 15px;">4. Прочее</p>
                
                <div class="sub-gallery">
                    <div class="sub-item" onclick="openModal(this)">
                        <img src="other.jpg" alt="Прочее">
                        <p>Главный обзор</p>
                    </div>
                    <div class="sub-item" onclick="openModal(this)">
                        <img src="img1.jpg" alt="img1">
                        <p>img1</p>
                    </div>
                    <div class="sub-item" onclick="openModal(this)">
                        <img src="img2.jpg" alt="img2">
                        <p>img2</p>
                    </div>
                    <div class="sub-item" onclick="openModal(this)">
                        <img src="img3.jpg" alt="img3">
                        <p>img3</p>
                    </div>
                </div>
            </div>
        </div>

        <a href="#" class="download-btn">Скачать KrisOS V1</a>
    </div>

    <div id="imageModal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="imgFull">
        <div id="modal-caption"></div>
    </div>

    <footer>
        <p>&copy; 2026 KrisOS.inc . Все права защищены.</p>
    </footer>

    <script>
        // Массив с цитатами про Win
        const quotes = [
            "«Технически Windows — это "операционная система", что означает, что она снабжает ваш компьютер базовыми командами, необходимыми для того, чтобы внезапно и без всякого предупреждения перестать работать.»",
            "«Microsoft не злая корпорация, они просто делают действительно паршивые операционные системы».",
            "«"Синий экран смерти" — это не баг, это функция!»",
            "«Существует множество способов предсказывать будущее, например, просто взглянуть на Windows». — Перефраз Билла Гейтса",
            "«Никто из тех, кто занимается компьютерами, не мог бы сказать, что определенного объема памяти хватит всем» — о знаменитом (и ошибочном) мифе про 640 Кб от Билла Гейтса",
            "«День, когда Microsoft сделает что-нибудь, что не будет сосать энергию и нервы, станет днем, когда они начнут делать пылесосы». — Эрнст Ян Плюгге"
        ];

        let currentQuoteIndex = 0;
        const quoteBox = document.getElementById('quote-box');

        function changeQuote() {
            quoteBox.style.opacity = 0;
            setTimeout(() => {
                quoteBox.textContent = quotes[currentQuoteIndex];
                quoteBox.style.opacity = 1;
                currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
            }, 500);
        }

        changeQuote();
        setInterval(changeQuote, 7000);

        // Функция открытия модального окна (приближения картинки)
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("imgFull");
        const captionText = document.getElementById("modal-caption");

        function openModal(element) {
            const img = element.querySelector('img');
            const txt = element.querySelector('p');
            
            modal.style.display = "block";
            modalImg.src = img.src;
            captionText.textContent = txt.textContent;
        }

        // Функция закрытия модального окна
        function closeModal() {
            modal.style.display = "none";
        }

        // Закрытие при клике в любое место мимо картинки
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
