<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>KrisOS-INFO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #3b82f6;
            margin-bottom: 40px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .os-block {
            display: block;
            width: 80%;
            max-width: 500px;
            padding: 20px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            transition: 0.2s;
        }
        /* Стиль для рабочей ОС */
        .active {
            background-color: #2563eb;
            color: white;
        }
        .active:hover {
            background-color: #1d4ed8;
        }
        /* Стиль для недоступных ОС */
        .disabled {
            background-color: #334155;
            color: #94a3b8;
        }
        .disabled:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <h1>KrisOS-INFO</h1>

    <div class="container">
        
        <!-- Первая ОС (Рабочая) -->
        <a href="https://km2911test.github.io/win10OS/" class="os-block active">
            KrisOSWin10
        </a>

        <!-- 4 пустых блока -->
        <a href="https://km2911test.github.io/osinfo/index-noos.htm" class="os-block disabled">
            OS недоступна
        </a>

        <a href="https://km2911test.github.io/osinfo/index-noos.htm" class="os-block disabled">
            OS недоступна
        </a>

        <a href="https://km2911test.github.io/osinfo/index-noos.htm" class="os-block disabled">
            OS недоступна
        </a>

        <a href="https://km2911test.github.io/osinfo/index-noos.htm" class="os-block disabled">
            OS недоступна
        </a>

    </div>

</body>
</html>
