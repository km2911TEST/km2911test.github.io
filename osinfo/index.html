<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrisOS-INFO</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent-color: #3b82f6;
            --disabled-color: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            margin-top: 50px;
            margin-bottom: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-color);
            text-transform: uppercase;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
            display: inline-block;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        .os-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        /* Стили для доступной OS */
        .os-card.active {
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.1);
        }

        .os-card.active:hover {
            background-color: var(--card-hover);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.25);
            border-color: var(--accent-color);
        }

        .os-card.active h2 {
            color: #60a5fa;
        }

        /* Стили для недоступных OS */
        .os-card.disabled {
            opacity: 0.6;
        }

        .os-card.disabled:hover {
            background-color: var(--card-hover);
            transform: translateY(-3px);
            opacity: 0.8;
        }

        .os-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }

        .os-card p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--disabled-color);
        }

        .os-card.active p {
            color: #94a3b8;
        }
    </style>
</head>

        <h1>KrisOS-INFO</h1>
    </header>
